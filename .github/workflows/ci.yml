name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: integrator_test
          POSTGRES_USER: integrator
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integrator -d integrator_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://integrator:test-password@127.0.0.1:5432/integrator_test
      TEST_DATABASE_URL: postgresql://integrator:test-password@127.0.0.1:5432/integrator_test
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Generate ephemeral test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "PROVISION_ADMIN_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Apply migrations to a clean database
        run: npm run migrate && npm run migrate
        working-directory: backend
      - name: Prove explicit provisioning and duplicate refusal
        working-directory: backend
        env:
          PROVISION_TENANT_NAME: CI tenant
          PROVISION_ADMIN_NAME: CI administrator
          PROVISION_ADMIN_EMAIL: ci-admin@example.test
        run: |
          npm run provision
          if npm run provision; then
            echo "Duplicate provisioning unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Backend checks and tests
        run: npm run check && npm test
        working-directory: backend
      - name: Backend dependency audit
        run: npm audit --audit-level=low
        working-directory: backend
      - name: Install and build frontend
        run: npm ci && npm run build && npm audit --audit-level=low
        working-directory: frontend
      - name: Validate Compose configuration
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: compose-test-password
      - name: Build production images
        run: docker compose build api worker frontend
        env:
          POSTGRES_PASSWORD: compose-test-password

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
